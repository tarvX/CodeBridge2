name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/desktop

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        id: check
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          if os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("Desktop releases can only be published from main.")

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          version = package.get("version") if isinstance(package, dict) else None
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(
                  f"Invalid package.json version {version!r}; expected X.Y.Z (for example 2.2.1)."
              )

          result = subprocess.run(
              ["git", "ls-remote", "--tags", "--refs", "origin", "refs/tags/v[0-9]*"],
              check=True,
              capture_output=True,
              text=True,
              timeout=30,
          )
          tag_pattern = re.compile(r"refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)\Z")
          tags = []
          for line in result.stdout.splitlines():
              ref = line.split("\t", 1)[-1]
              match = tag_pattern.fullmatch(ref)
              if match:
                  tags.append(match.group(1))

          existing_tag = version in tags
          latest = max(tags, key=lambda value: tuple(map(int, value.split(".")))) if tags else None
          if not existing_tag and latest is not None:
              current_tuple = tuple(map(int, version.split(".")))
              latest_tuple = tuple(map(int, latest.split(".")))
              if current_tuple <= latest_tuple:
                  raise SystemExit(
                      f"package.json version {version} must be greater than the latest existing "
                      f"version tag v{latest}; no release was started."
                  )

          should_release = "false" if existing_tag else "true"
          if existing_tag:
              print(f"Tag v{version} already exists; skipping release.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"should_release={should_release}\n")
          PY


      - name: Sync version and run tests
        shell: bash
        run: |
          python ../../scripts/sync_version.py
          PYTHONPATH=src python -m unittest discover -s tests -v


  test:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync version and run tests
        shell: bash
        run: |
          python ../../scripts/sync_version.py
          python -m unittest discover -s tests -v

  build:
    needs: [version, test]
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bin: codebridge.exe
          - os: ubuntu-22.04
            platform: linux-x64
            bin: codebridge
          - os: macos-latest
            platform: macos-arm64
            bin: codebridge
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync version and build binary
        shell: bash
        run: |
          python ../../scripts/sync_version.py
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .
          python ../../scripts/sync_version.py
          # CODEBRIDGE_VERSION_PREBUILD_CHECK
          python - <<'PY'
          import importlib
          import json
          import sys
          from pathlib import Path

          # Force Python to load the project source, not an installed copy.
          sys.path.insert(0, str(Path("src").resolve()))

          package = json.loads(
              Path("../../package.json").read_text(encoding="utf-8")
          )
          expected = package["version"]

          version_module = importlib.import_module("codebridge._version")

          actual = version_module.__version__
          module_path = Path(version_module.__file__).resolve()

          print(f"Expected version: {expected}")
          print(f"Actual version:   {actual}")
          print(f"Version module:   {module_path}")

          if actual != expected:
              raise SystemExit(
                  f"Version mismatch: expected {expected}, got {actual}"
              )

          print("Version metadata is ready for PyInstaller.")
          PY
          pyinstaller --onefile --clean --name codebridge --paths src \
            --hidden-import codebridge._version packaging/entry.py

      - name: Smoke test binary version
        shell: bash
        run: |
          expected="${{ needs.version.outputs.version }}"
          actual="$(./dist/${{ matrix.bin }} --version)"
          test "$actual" = "codebridge $expected" || {
            echo "Expected codebridge $expected, got: $actual"
            exit 1
          }
          case "$actual" in
            *-dev*) echo "Release binary contains a development version: $actual"; exit 1 ;;
          esac

      - name: Package ZIP
        shell: bash
        run: |
          python packaging/make_zip.py build \
            --platform "${{ matrix.platform }}" \
            --binary "dist/${{ matrix.bin }}" \
            --out dist

      - name: Verify ZIP (contents and extracted binary version)
        shell: bash
        run: |
          python packaging/make_zip.py verify \
            "dist/codebridge-${{ matrix.platform }}.zip" \
            --platform "${{ matrix.platform }}" \
            --run

      - uses: actions/upload-artifact@v4
        with:
          name: codebridge-${{ matrix.platform }}
          path: apps/desktop/dist/codebridge-${{ matrix.platform }}.zip
          if-no-files-found: error

  package:
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync version and build Python packages
        shell: bash
        run: |
          python ../../scripts/sync_version.py
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/download-artifact@v4
        with:
          path: apps/desktop/release
          merge-multiple: true

      - name: Collect, validate and checksum release assets
        shell: bash
        run: |
          mkdir -p release
          cp dist/* release/

          for file in \
            codebridge-windows-x64.zip \
            codebridge-linux-x64.zip \
            codebridge-macos-arm64.zip; do
            test -s "release/$file" || {
              echo "::error::Missing or empty release asset: $file"
              exit 1
            }
          done

          compgen -G "release/*.whl" >/dev/null || {
            echo "::error::No wheel package was built."
            exit 1
          }
          compgen -G "release/*.tar.gz" >/dev/null || {
            echo "::error::No source distribution was built."
            exit 1
          }

          cd release
          sha256sum * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: apps/desktop/release/*
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: python ../../scripts/changelog_section.py CHANGELOG.md "${{ needs.version.outputs.version }}" > release-notes.md

      - name: Ensure the version tag is still available
        shell: bash
        run: |
          tag="v${{ needs.version.outputs.version }}"
          remote_tag="$(git ls-remote --tags --refs origin "refs/tags/$tag")"
          if [ -n "$remote_tag" ]; then
            echo "::error::Remote tag $tag already exists; refusing to publish or overwrite the release."
            exit 1
          fi

      - name: Publish GitHub release and create version tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: apps/desktop/release/*
          body_path: apps/desktop/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
          overwrite_files: false
